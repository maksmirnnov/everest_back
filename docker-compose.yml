services:
  everest_back:
    build:
      context: ./
    volumes:
      - static_volume:/everest_back/static
    environment:
      - DB_HOST=database
      - DB_NAME=everest_db
      - DB_USER=django
      - DB_PASS=Eipeuw7Fi9oh
    command: >
      sh -c "
        sleep 20 &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        gunicorn --bind 0.0.0.0:8000 --workers 3 everest.wsgi:application
      "
    depends_on:
      - database
    restart: on-failure:5
    expose:
      - 8000

  database:
    image: postgres:17.2-alpine
    environment:
      - POSTGRES_DB=everest_db
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=Eipeuw7Fi9oh
  
  nginx:
    # image: nginx:stable-alpine
    build:
      context: ./nginx/
    ports:
      - 80:80
    volumes:
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # - ./nginx/sites-enabled:/etc/nginx/sites-enabled
      # - ./nginx/proxy_params:/etc/nginx/proxy_params
      - static_volume:/etc/nginx/static:ro
    depends_on:
      - everest_back

volumes:
  static_volume:


