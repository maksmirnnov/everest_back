services:
  everest_back:
    build:
      context: ./
    ports:
      - "8000:8000"
    volumes:
      - ./:/everest_back
    environment:
      - DB_HOST=database
      - DB_NAME=everest_db
      - DB_USER=django
      - DB_PASS=Eipeuw7Fi9oh
    command: >
      sh -c "ls -lha && sleep 10 && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - database
    restart: on-failure:5

  database:
    image: postgres:16.0-alpine
    environment:
      - POSTGRES_DB=everest_db
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=Eipeuw7Fi9oh

