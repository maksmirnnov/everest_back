services:
  everest_back:
    build:
      context: ./
    volumes:
      - static_volume:/everest_back/static
      - nginx_templates_volume:/everest_back/nginx/templates
    environment:
      - DB_HOST=database
      - DB_NAME=everest_db
      - DB_USER=django
      - DB_PASS=Eipeuw7Fi9oh
      - BACK_PORT=${BACK_PORT}
    command: >
      sh -c "
        sleep 20 &&
        python manage.py makemigrations &&
        python manage.py migrate &&
        gunicorn --bind 0.0.0.0:$BACK_PORT --workers 3 everest.wsgi:application
      "
    depends_on:
      - database
    restart: on-failure:5
    expose:
      - ${BACK_PORT}

  database:
    image: postgres:17.2-alpine
    environment:
      - POSTGRES_DB=everest_db
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=Eipeuw7Fi9oh
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  nginx:
    build:
      context: ./nginx/
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/sites-enabled
      - BACK_PORT=${BACK_PORT}
      - NGINX_PORT=${NGINX_PORT}
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
    volumes:
      - static_volume:/etc/nginx/static:ro
      - nginx_templates_volume:/etc/nginx/templates:ro
    depends_on:
      - everest_back

volumes:
  static_volume:
  pgdata:
  nginx_templates_volume:


