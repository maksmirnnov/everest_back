services:
  everest_back:
    build:
      context: ./
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_NAME=everest_db
      - DB_USER=django
      - DB_PASS=Eipeuw7Fi9oh
    command: >
      sh -c "sleep 20 && gunicorn --bind 0.0.0.0:8000 --workers 3 everest.wsgi:application"
    depends_on:
      - database
    restart: on-failure:5

  database:
    image: postgres:16.0-alpine
    environment:
      - POSTGRES_DB=everest_db
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=Eipeuw7Fi9oh

